name: Integration Branch Quality

# This check is intentionally scoped to the Vite/Express integration line.
# The existing default-branch CI and staging deploy workflows are left unchanged.
on:
  push:
    branches:
      - kit/integration
      - 'docs/kit-integration-*'
      - 'chore/kit-integration-*'
  pull_request:
    branches:
      - kit/integration

permissions:
  contents: read

jobs:
  checks:
    name: Docs, security, types, build and tests (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      SKIP_BROWSER_TESTS: "true"
    steps:
      - name: Checkout complete history for secret scan
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore dependencies from the reviewed Bun lockfile
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Validate maintained documentation links
        run: |
          npm run test:docs
          npm run docs:links

      - name: Inventory links in older documentation (informational)
        continue-on-error: true
        run: npm run docs:links:all

      - name: Scan full Git history for secrets
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --config .gitleaks.toml --verbose

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build the Vite application
        run: npm run build

      - name: Run repository test suites
        run: npm test

      - name: Dependency vulnerability audit
        run: npm run audit:deps
