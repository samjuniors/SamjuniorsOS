name: Sophia production response-path regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "tests/sophia/production_response_path_regression.test.ts"
      - "tests/sophia/sofiaui_voice_runtime.test.ts"
      - "tests/sophia/phase4_governance_hardening.test.ts"
      - "tests/sophia/phase5_voice_parity.test.ts"
      - "src/lib/server/sophia/**"
      - "src/lib/server/retrieval/**"
      - "src/lib/server/live/**"
      - "src/lib/server/voice-legacy.ts"
      - "src/lib/client/live/**"
      - "src/os/lib/**"
      - "src/app/api/sofia/**"
      - "src/app/api/realtime/**"
      - "benchmark/memory-retrieval/**"
      - ".github/workflows/sophia-response-path-regression.yml"
  push:
    branches:
      - main
    paths:
      - "tests/sophia/production_response_path_regression.test.ts"
      - "tests/sophia/sofiaui_voice_runtime.test.ts"
      - "tests/sophia/phase4_governance_hardening.test.ts"
      - "tests/sophia/phase5_voice_parity.test.ts"
      - "src/lib/server/sophia/**"
      - "src/lib/server/retrieval/**"
      - "src/lib/server/live/**"
      - "src/lib/server/voice-legacy.ts"
      - "src/lib/client/live/**"
      - "src/os/lib/**"
      - "src/app/api/sofia/**"
      - "src/app/api/realtime/**"
      - "benchmark/memory-retrieval/**"
      - ".github/workflows/sophia-response-path-regression.yml"

permissions:
  contents: read

jobs:
  response-path-regression:
    name: Run isolated S6/S9 regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run production response-path regression
        run: bun tests/sophia/production_response_path_regression.test.ts
      - name: Run SofiaUI voice runtime suite
        run: bun tests/sophia/sofiaui_voice_runtime.test.ts
      - name: Run Phase 4 governance hardening suite
        run: bun tests/sophia/phase4_governance_hardening.test.ts
      - name: Run Phase 5 voice parity suite
        run: bun tests/sophia/phase5_voice_parity.test.ts
