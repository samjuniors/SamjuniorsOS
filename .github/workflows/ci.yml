name: CI

on:
  push:
    branches:
      - main
      - kit/integration
      - 'step/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Typecheck, Build, Full Tests & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun (runner divergence compatibility)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Secret scan (Gitleaks full-history & PR validation)
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --config .gitleaks.toml --verbose

      - name: Client bundle secret scan
        run: npm run scan:client-secrets

      - name: Dependency security audit
        run: npm run audit:deps

      - name: Lint verification
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Run canonical test suite
        run: npm test

      - name: Memory retrieval benchmark regression gate (G4.4)
        run: npm run benchmark:memory

      - name: Frontend performance budgets and Core Web Vitals gate (G8.3)
        run: npm run benchmark:perf
